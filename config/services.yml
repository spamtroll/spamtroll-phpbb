services:
    spamtroll.phpbb.http_client:
        class: spamtroll\phpbb\service\http_client

    spamtroll.phpbb.client_factory:
        class: spamtroll\phpbb\service\client_factory
        arguments:
            - '@config'
            - '@spamtroll.phpbb.http_client'

    spamtroll.phpbb.logger:
        class: spamtroll\phpbb\service\logger
        arguments:
            - '@dbal.conn'
            - '%core.table_prefix%'

    spamtroll.phpbb.scanner:
        class: spamtroll\phpbb\service\scanner
        arguments:
            - '@spamtroll.phpbb.client_factory'
            - '@config'
            - '@spamtroll.phpbb.logger'
            - '@user'

    spamtroll.phpbb.listener:
        class: spamtroll\phpbb\event\main_listener
        arguments:
            - '@spamtroll.phpbb.scanner'
            - '@config'
            - '@user'
            - '@request'
        tags:
            - { name: event.listener }

    # NOTE: no service definition for \spamtroll\phpbb\acp\main_module.
    # phpBB builds ACP modules with a bare `new $class_name($this)`
    # (includes/functions_module.php:598-600) and never consults the DI
    # container, so such an entry would be dead code. The module resolves
    # its own dependencies from $phpbb_container inside main().
