name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# phpBB installs extensions by unpacking an archive into ext/<vendor>/<name>/.
# There is no `composer install` step on the target board, so the archive has
# to carry the production `vendor/` tree (the SDK + its autoloader) or the
# extension fatals the moment phpBB tries to enable it.
jobs:
  package:
    name: Build extension archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader --classmap-authoritative

      - name: Assemble ext/spamtroll/phpbb tree
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/ext/spamtroll/phpbb
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build' \
            --exclude 'tests' \
            --exclude '.phpunit.cache' \
            --exclude '.phpstan.cache' \
            --exclude 'phpunit.xml.dist' \
            --exclude 'phpstan.neon' \
            ./ build/ext/spamtroll/phpbb/
          test -f build/ext/spamtroll/phpbb/vendor/autoload.php
          test -d build/ext/spamtroll/phpbb/vendor/spamtroll/php-sdk

      - name: Create archive
        id: archive
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # workflow_dispatch on a branch has no version in the ref name
          case "$GITHUB_REF_TYPE" in tag) ;; *) VERSION="snapshot-${GITHUB_SHA:0:7}" ;; esac
          NAME="spamtroll_phpbb_${VERSION}.zip"
          (cd build && zip -qr "../${NAME}" ext)
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          unzip -l "${NAME}" | tail -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.name }}
