name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    name: Build verified extension archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          tools: composer:v2
      - name: Build package with production SDK and license
        run: bash build/build-package.sh
      - name: Verify actual ZIP
        run: python3 build/verify-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: spamtroll-phpbb
          path: dist/*
      - name: Attach verified assets to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
