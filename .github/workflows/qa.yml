name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-version --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer exec phpstan -- analyse --memory-limit=1G --no-progress

      - name: Run PHPUnit
        run: composer exec phpunit -- --colors=always


  package:
    name: Installable package and official EPV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          tools: composer:v2
      - name: Fetch official pinned validator
        uses: actions/checkout@v4
        with:
          repository: phpbb/epv
          ref: cc230d4a0253d7f6dc0d0c526c2db84ccd831f35
          path: .epv-validator
      - name: Install validator
        run: composer install --working-dir=.epv-validator --no-dev --prefer-dist --no-interaction --no-progress
      - name: Build and verify distributable
        run: |
          bash build/build-package.sh
          python3 build/verify-package.py
          python3 build/check-epv.py .epv-validator
